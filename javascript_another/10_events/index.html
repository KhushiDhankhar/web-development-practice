<!-- In JavaScript, there are several ways to attach event handlers to HTML elements.
    Here are 3 common methods:          -->

<! DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        h1 {
            margin-bottom: 2.4rem;
        }

        button{
            margin-top : 0px;
            margin-right : 10px;
            border-radius: 30px;
            background-color: yellow;
            font-size : 30px ;
            height : 80px;
            padding : 20px;
            width : 200px;
            
        }
    </style>
</head>
<body>

    <!-- start inline event  -->
    <h1> Inline event</h1>
    <button> greeting </button>
    <button> greeting again </button>

    <h1>Dom Event handler </h1>
    <button> greeting </button>
    <button> greeting again </button>

    <h1>addEventListener event handler </h1>
    <button> greeting </button>
    <button> greeting again </button>

</body>
