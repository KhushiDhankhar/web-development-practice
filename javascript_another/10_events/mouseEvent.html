
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MouseEvent Example</title>
    <!-- <link rel="stylesheet" href="style.css" /> -->
    <style> 

        *{
            padding : 10px;
            margin  : 10px;
        }

        section {
            display: flex;
            align-items: center;
            justify-content : center;
        }

        .rectangle{
            height : 100px;
            width : 100px;
            background-color : yellow;
        
        }

        /* .rectangle:hover{
            border-radius : 50%;
        } */

        button{
            height : 40px;
            background-color : yellow;
            font-size : 30px;
            padding : 5px;
        }

        .addTransition{
            border-radius : 50%;
        }

        .addTransition2{
            border-radius : 0px;
            background-color : rgb(220, 113, 188);
        }

        .addTransition3 {
            border-radius : 50%;
            background-color : rgb(0, 128, 255);
            translate: -30rem 0;  /* move -ve side */ 
        }

        .addTransition4 {
            border-radius: 50%;
            background-color: #8ed4f9;
            translate: 30rem 0;
        }

        .addTransition5 {
            border-radius: 50%;
            background-color: #73f562;
            translate: -20rem 0;
        }

        .addTransition6 {
            border-radius: 0%;
            background-color: #f5c662;
            translate : 50rem 0 ;
        }
    </style>

</head>

<body>

    <section>
        <div class="rectangle"></div>
        <button id="myButton">Click me</button>
    </section>

    <script>
        // get the button element by its Id
        let myButton = document.getElementById("myButton");
        let rectDiv = document.querySelector(".rectangle");

        const handleMouseEvents = () => {
            console.log("click on button ");
            rectDiv.style.backgroundColor = "green";
        }

        // adding classses using dom 
        const handleMouseEvents2 = ()=> {
            console.log("dblclick on button");
            rectDiv.classList.add("addTransition");
        }

        const handleMouseEvents3 = () => {
            console.log("mouse over");
            rectDiv.classList.add("addTransition3");
        }

        const handleMouseEvents4 = () => {
            console.log("mouse out");
            rectDiv.classList.add("addTransition4");
        }

        const handleMouseEvents5 = ()=> {
            console.log("mouse down");
            rectDiv.classList.add("addTransition5");
        }

        const handleMouseEvents6 = ()=> {
            console.log("mouse up");
            rectDiv.classList.add("addTransition6");
        }

    // todo- show them css animation part

        // Attach the handleClick function to the click event of the button
        myButton.addEventListener("click", handleMouseEvents);

        // used when need to pass argument
        myButton.addEventListener("dblclick", () => {
            handleMouseEvents2();
        });


        rectDiv.addEventListener("mouseover", handleMouseEvents3);
        rectDiv.addEventListener("mouseout", handleMouseEvents4);
        rectDiv.addEventListener("mousedown", handleMouseEvents5);
        rectDiv.addEventListener("mouseup", handleMouseEvents6);

    </script>

</body>
</html>
