<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> todo list</title>
        <link rel = "stylesheet" href = "style.css">
    </head>

    <body>
        <h1>Todo List App</h1>
        <br>
        <form>
            <div>
                <input type = "text" id = "inputValue" placeholder="Add a todo..." />
                <button type = "submit" class = "btn" > Add Todo </button>
                <!-- type = "submit"  treats it as submit form and trigger add to list -->

                <!-- using this type = " button " at deletebtn cuz i dont want deletebtn to trigger when i press enter -->
                
                <!-- type="button" stops the browser treating this as a form
                    submit button on any edge case where preventDefault
                    doesn't fire before the default action -->

            </div>

            <section class = "todo-lists-elem"></section>
        </form>
        
        <!-- external js -->
        <script src = "script.js"></script>

    </body>
</html>
